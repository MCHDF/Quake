name: Quake
version: '${version}'

main: moe.mchdf.quake.Quake
api-version: '26.3'
load: POSTWORLD

commands:
  quake:
    description: Quake 미니게임 관리 명령어
    usage: /quake world <create|delete|tp|players|status|spawn|lobby> ...
    permission: quake.command
    permission-message: 이 명령어를 사용할 권한이 없습니다.
  settings:
    description: 내 설정 화면 열기
    usage: /settings
    aliases: [설정]
    permission: quake.settings

permissions:
  quake.command:
    description: Quake 관리 명령어 사용 권한
    default: op
  quake.settings:
    description: 내 설정 화면 열기
    default: true
