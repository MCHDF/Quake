name: Quake
version: '${version}'

main: moe.mchdf.quake.Quake
api-version: '26.3'
load: POSTWORLD

commands:
  quake:
    description: Quake 미니게임 관리 명령어
    usage: /quake world <create|delete|tp> <name>
    permission: quake.command
    permission-message: 이 명령어를 사용할 권한이 없습니다.

permissions:
  quake.command:
    description: Quake 관리 명령어 사용 권한
    default: op
